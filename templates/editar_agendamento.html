{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Agendamento - Sangue Bom</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <main>

        <h1>Editar Agendamento</h1>

        <p>Altere os dados do agendamento.</p>

        <form method="POST">

            {% csrf_token %}

            <!-- DOADOR -->
            <label for="doador">
                Doador:
            </label>

            <select name="doador" id="doador" required>

                {% for doador in doadores %}

                    <option
                        value="{{ doador.id }}"
                        {% if doador.id == agendamento.doador.id %}
                            selected
                        {% endif %}
                    >
                        {{ doador.nome }}
                    </option>

                {% endfor %}

            </select>

            <br><br>


            <!-- HEMOCENTRO -->
            <label for="hemocentro">
                Hemocentro:
            </label>

            <select name="hemocentro" id="hemocentro" required>

                {% for hemocentro in hemocentros %}

                    <option
                        value="{{ hemocentro.id }}"
                        {% if hemocentro.id == agendamento.hemocentro.id %}
                            selected
                        {% endif %}
                    >
                        {{ hemocentro.nome }}
                    </option>

                {% endfor %}

            </select>

            <br><br>


            <!-- TIPO DE DOAÇÃO -->
            <label for="tipo_doacao">
                Tipo de Doação:
            </label>

            <select name="tipo_doacao" id="tipo_doacao" required>

                <option
                    value="Sangue total"
                    {% if agendamento.tipo_doacao == "Sangue total" %}
                        selected
                    {% endif %}
                >
                    Sangue total
                </option>

                <option
                    value="Plaquetas"
                    {% if agendamento.tipo_doacao == "Plaquetas" %}
                        selected
                    {% endif %}
                >
                    Plaquetas
                </option>

                <option
                    value="Plasma"
                    {% if agendamento.tipo_doacao == "Plasma" %}
                        selected
                    {% endif %}
                >
                    Plasma
                </option>

            </select>

            <br><br>


            <!-- DATA -->
            <label for="data">
                Data:
            </label>

            <input
                type="date"
                name="data"
                id="data"
                value="{{ agendamento.data|date:'Y-m-d' }}"
                required
            >

            <br><br>


            <!-- HORÁRIO -->
            <label for="horario">
                Horário:
            </label>

            <input
                type="time"
                name="horario"
                id="horario"
                value="{{ agendamento.horario|time:'H:i' }}"
                required
            >

            <br><br>


            <!-- BOTÃO SALVAR -->
            <button type="submit">
                💾 Salvar Alterações
            </button>

        </form>

        <br>

        <a href="{% url 'listar_agendamentos' %}">
            ← Voltar para agendamentos
        </a>

    </main>

</body>

</html>
